[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "transit-delay-prediction"
version = "0.1.0"
description = "Point-in-time correct TransLink delay prediction pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "gtfs-realtime-bindings>=1.0,<2",
  "httpx>=0.28,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "polars>=1.20,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.6,<2",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
strong-model = ["lightgbm>=4.5,<5"]
dev = [
  "coverage[toml]>=7.6,<8",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
transit-delay = "transit_delay.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/transit_delay"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=transit_delay --cov-report=term-missing --cov-fail-under=60"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["transit_delay"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
